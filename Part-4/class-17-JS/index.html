<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Digital Clock</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-WvP5j2iQv1H37i0yp+J6N8t8pfpBdIhs6Qk0gcn02sEpn4QZ5w/q0p6IW3Pm3dCR" crossorigin="anonymous" />
        <style>
            body {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #f8f9fa;
            }
            .clock-card {
                width: 100%;
                max-width: 360px;
            }
            .clock-time {
                font-size: 3rem;
                letter-spacing: 0.08em;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }
        </style>
    </head>
    <body>
        <div class="container py-5">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="card shadow-sm clock-card">
                        <div class="card-body text-center">
                            <h1 class="h4 text-primary mb-3">Digital Clock</h1>
                            <p id="abc" class="clock-time mb-1">--:--:--</p>
                            <p class="text-muted mb-0">Updates every second using JavaScript</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="./data.js" type="text/javascript"></script>
    </body>
</html>
